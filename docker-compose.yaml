version: '3.8'

services:
  backend:
    build: ./vamos-back
    ports:
      - "8000:8000"
    volumes:
      - ./vamos-back:/app
    environment:
      - NODE_ENV=development

  frontend:
    build: ./vamos-app
    ports:
      - "5173:5173"
    volumes:
      - ./vamos-app:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
  
volumes:
  node_modules:
